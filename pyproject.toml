[project]
name = "argus"
version = "0.1.0"
description = "Local-first multilingual architecture intelligence and static risk analysis"
readme = "README.md"
authors = [
    { name = "g-carames", email = "gisellecarames@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[project.scripts]
argus = "argus:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
