[project]
name = "argus"
version = "0.1.0"
description = "Local-first multilingual architecture intelligence and static risk analysis"
readme = "README.md"
authors = [
    { name = "g-carames", email = "gisellecarames@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.4,<4",
    "pathspec>=0.12,<1",
    "sqlparse>=0.5,<0.6",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash>=0.25,<0.26",
    "tree-sitter-css>=0.25,<0.26",
    "tree-sitter-html>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-yaml>=0.7,<0.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["installed_cli: builds a wheel and tests the installed CLI in an isolated offline environment"]
addopts = "--import-mode=importlib -ra"

[project.scripts]
argus = "argus:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
